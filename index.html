<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Sell Time Estimator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Vehicle Sell Time Estimator</h1>
        <form id="carForm">
            <div class="form-group">
                <label>Make:</label>
                <select id="make" required>
                    <option value="">Select Make</option>
                    <option value="honda">Honda</option>
                    <option value="toyota">Toyota</option>
                    <option value="ford">Ford</option>
                    <!-- Add more makes -->
                </select>
            </div>
            
            <div class="form-group">
                <label>Model:</label>
                <select id="model" required>
                    <option value="">Select Model</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Year:</label>
                <input type="number" id="year" min="1990" max="2026" required>
            </div>
            
            <div class="form-group">
                <label>Mileage:</label>
                <input type="number" id="mileage" min="0" required>
            </div>
            
            <div class="form-group">
                <label>Condition:</label>
                <select id="condition" required>
                    <option value="">Select Condition</option>
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="fair">Fair</option>
                    <option value="poor">Poor</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Asking Price ($):</label>
                <input type="number" id="price" min="0" step="100" required>
            </div>
            
            <button type="submit">Estimate Sell Time</button>
        </form>
        
        <div id="results" class="hidden">
            <h2>Estimation Results</h2>
            <div id="estimateOutput"></div>
        </div>
    </div>
    
    <script src="data/market-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
